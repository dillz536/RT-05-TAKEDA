name: Infra images
on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'infra/**'
      - 'rest-api/**'
      - 'website/**'
      - '.github/workflows/infra.yml'
  push:
    branches: [main]
    paths:
      - '.dockerignore'
      - 'infra/**'
      - 'rest-api/**'
      - 'website/**'
      - '.github/workflows/infra.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontrak statis Redis/worker M03
        run: node infra/scripts/check-m03-compose.mjs
      - name: Regresi isolasi credential DB
        run: python3 -B infra/scripts/check_database_isolation.py --self-test
      - name: Secrets/cache tidak masuk build context
        run: bash infra/scripts/check-build-context.sh
      - name: Kontrak CLI Compose untuk migrasi one-shot
        run: |
          docker compose run --help | grep -q -- --no-deps
          docker compose run --help | grep -q -- --pull
          if grep -E '^[^#]*run .*--no-build' infra/scripts/deploy-staging-immutable.sh; then
            echo 'compose run does not accept --no-build'; exit 1
          fi
      - name: Validasi compose production + override VPS
        env:
          API_APP_KEY: x
          WEB_APP_KEY: x
          APP_URL: https://example.test
          DATABASE_URL: postgresql://rt05_app:local-dev-only@127.0.0.1:5432/rt05_test
          DATABASE_URL_UNPOOLED: postgresql://rt05_migrator:local-dev-only@127.0.0.1:5432/rt05_test
          RT05_ENV: ci
          RT05_HOST: example.test
          APP_ENV: ci
          REDIS_PASSWORD: ci-only-redis
          REDIS_CACHE_PASSWORD: ci-only-cache
        run: |
          docker compose -f infra/compose.production.yml config --quiet
          docker compose -f infra/compose.production.yml config --format json | python3 -B infra/scripts/check_database_isolation.py
          docker compose -f infra/compose.production.yml -f infra/compose.vps.yml config --format json | python3 -B infra/scripts/check_database_isolation.py
          docker compose -f infra/compose.production.yml -f infra/compose.vps.yml config > /tmp/merged.yml
          grep -q 'rt05-ci-https.rule' /tmp/merged.yml && grep -q 'example.test' /tmp/merged.yml
          grep -q 'worker-default' /tmp/merged.yml
          grep -q 'redis-cache' /tmp/merged.yml
          grep -q 'notifications,default' /tmp/merged.yml
          grep -Eq 'REDIS_QUEUE_CONNECTION: "?queue"?' /tmp/merged.yml
          if grep -E 'published: ["'\'']?6379' /tmp/merged.yml; then echo 'Redis terpublikasi'; exit 1; fi
          bash -n infra/scripts/deploy-vps.sh
          bash -n infra/scripts/deploy-staging-immutable.sh
          bash -n infra/scripts/staging-runtime-smoke.sh
          bash -n infra/scripts/staging-metadata.sh
          bash -n infra/scripts/check-build-context.sh
          python3 -B infra/scripts/test_staging_redis_auth.py
          bash -n infra/scripts/ci-redis.sh
          bash -n infra/scripts/m03-recovery-ci.sh
          bash -n infra/docker/redis-queue.sh
          bash -n infra/docker/redis-cache.sh
          bash -n infra/docker/redis-health.sh
      - name: Build image API
        run: docker build -f infra/docker/api.Dockerfile -t rt05-api:ci .
      - name: Build image website
        run: docker build -f infra/docker/web.Dockerfile -t rt05-web:ci .
      - name: Smoke image (tanpa database)
        run: |
          docker network create rt05ci
          docker run -d --name web --network rt05ci -e APP_KEY=base64:$(openssl rand -base64 32) -e APP_URL=http://localhost rt05-web:ci
          docker run -d --name api --network rt05ci -e APP_KEY=base64:$(openssl rand -base64 32) -e APP_URL=http://localhost \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/x -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync rt05-api:ci
          docker run -d --name gateway --network rt05ci -p 8080:80 -v $PWD/infra/docker/gateway.Caddyfile:/etc/caddy/Caddyfile:ro caddy:2-alpine
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/health/live && break; sleep 2; done
          echo; curl -fsS http://127.0.0.1:8080/api/v1 | tee /tmp/api.json; echo
          grep -q '"api_version":"v1"' /tmp/api.json
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/health/ready); echo "ready=$code"; test "$code" = "503"
          curl -fsS http://127.0.0.1:8080/profil -o /tmp/profil.html && grep -q 'Agus Ferdiansyah' /tmp/profil.html && echo "website /profil OK"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/tidak-ada); echo "api 404=$code"; test "$code" = "404"
      - if: failure()
        run: docker logs api; docker logs web; docker logs gateway
